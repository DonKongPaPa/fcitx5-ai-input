name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Flutter JIT 资产 + raw embedder 引擎只构建/下载一次（四路复用）。
  # flutter-version 必须钉死：引擎 .so 与 kernel_blob 的引擎 hash 必须一致
  #（3.44.8 = engine 0cd610717b，见 scripts/fetch-flutter-embedder.sh）
  flutter-bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter --version
      - name: Build JIT bundle + fetch embedder engine
        run: |
          cd flutter && flutter pub get && flutter build bundle
          mkdir -p ../flutter-out && cp -r build/flutter_assets ../flutter-out/
          SDK=$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")
          cp "$SDK/bin/cache/artifacts/engine/linux-x64/icudtl.dat" ../flutter-out/
          cd .. && bash scripts/fetch-flutter-embedder.sh
          cp .cache/flutter-embedder/libflutter_engine.so flutter-out/
          # sherpa-onnx 运行时随工件下发：打包容器（debian/fedora）没有
          # curl 且包管理器各异，统一在 ubuntu job 下载（sha256 钉死）
          bash scripts/fetch-sherpa-runtime.sh
          cp .cache/sherpa-onnx/libsherpa-onnx-c-api.so \
             .cache/sherpa-onnx/libonnxruntime.so flutter-out/
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-bundle
          path: flutter-out/
          retention-days: 3

  package:
    needs: flutter-bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: arch
            image: docker.io/library/archlinux:base-devel
          - id: debian
            image: docker.io/library/debian:bookworm
          - id: fedora
            image: registry.fedoraproject.org/fedora:latest
          - id: tarball
            image: docker.io/library/debian:bookworm
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-bundle
          path: flutter-bundle-dl
      - name: Package + smoke
        # 不用 github.workspace：ubuntu 容器里它展开 /home/runner/... 而
        # runner 实际挂在 /__w/...（download-artifact 的路径）——用 $PWD
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # GITHUB_ENV 下一步才生效：本步内直接 export
          export VERSION="${VERSION#v}"
          # sherpa 运行时从 flutter-bundle 工件种到 .cache（CMake 默认路径）
          mkdir -p .cache/sherpa-onnx
          cp flutter-bundle-dl/libsherpa-onnx-c-api.so \
             flutter-bundle-dl/libonnxruntime.so .cache/sherpa-onnx/
          export SRC="$PWD" \
                 FLUTTER_ASSETS="$PWD/flutter-bundle-dl" \
                 FLUTTER_ENGINE_LIBRARY="$PWD/flutter-bundle-dl/libflutter_engine.so"
          bash packaging/${{ matrix.id }}/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.id }}
          path: artifacts/packages/*
          retention-days: 3

  release:
    needs: [flutter-bundle, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && ls -la
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## fcitx5-voice-input ${{ github.ref_name }}

            语音输入：任何输入法激活时长按右 Ctrl 即用（无需切换，与
            rime/pinyin 共存）。内置 sherpa-onnx CPU 流式引擎（零显存，
            模型脚本下载）+ SenseVoice 松手重识别；可选 FunASR 服务档
            （31 语种）/ GGUF 本地档。Flutter MD3 光标跟随卡片（引擎进程
            内嵌入，无独立窗口/进程）+ 候选选择（数字/方向键/鼠标）+
            configtool 热改设置。

            ### 安装
            - **Arch**: `pacman -U fcitx5-voice-input-*.pkg.tar.zst`
            - **Debian**: `apt install ./fcitx5-voice-input_*.deb`
            - **Fedora**: `dnf install fcitx5-voice-input-*.rpm`
            - **其他**: 解压 tarball 后 `sudo bash install.sh`（需 gcc/cmake/fcitx5-dev/wayland-dev）

            ### 依赖
            fcitx5 ≥ 5.0、pulseaudio-utils（parec 采集）。语音服务可选：
            configtool → Voice Input → 模型部署（FunASRAutoStart + 设备/量化档）。
          files: dist/*
